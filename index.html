<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PHARMA MANAGER – ABK Technology</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<!-- ══════════════════ LOGIN ══════════════════ -->
<div id="login-screen" class="login-screen">
  <div class="login-bg">
    <div class="login-glow"></div>
  </div>
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">💊</div>
      <div class="logo-text">
        <h1>PHARMA MANAGER</h1>
        <span>by MARHABA ABK TECHNOLOGY</span>
      </div>
    </div>
    <form id="login-form" class="login-form" onsubmit="return false;">
      <div class="field-group">
        <label>Identifiant</label>
        <input type="text" id="login-user" placeholder="admin" autocomplete="username" />
      </div>
      <div class="field-group">
        <label>Mot de passe</label>
        <div class="pwd-wrap">
          <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" />
          <button type="button" class="eye-btn" onclick="togglePwd()">👁</button>
        </div>
      </div>
      <div id="login-error" class="login-error hidden">Identifiant ou mot de passe incorrect.</div>
      <button type="button" class="btn-login" onclick="doLogin()">Connexion</button>
    </form>
    <div class="login-hint">Admin : <b>admin / admin123</b> &nbsp;|&nbsp; Caissier : <b>caissier / caissier123</b></div>
  </div>
</div>

<!-- ══════════════════ APP SHELL ══════════════════ -->
<div id="app" class="app hidden">

  <!-- SIDEBAR -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">💊</div>
      <div class="sidebar-title">
        <span class="s-title">PHARMA</span>
        <span class="s-sub">MANAGER</span>
      </div>
      <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav">
      <!-- generated by JS -->
    </nav>

    <div class="sidebar-footer">
      <div class="user-pill" id="user-pill"></div>
      <button class="btn-logout" onclick="doLogout()">Déconnexion</button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main-wrap" id="main-wrap">
    <!-- TOP BAR -->
    <header class="topbar">
      <button class="topbar-menu" onclick="toggleSidebar()">☰</button>
      <div class="topbar-title" id="topbar-title">Tableau de bord</div>
      <div class="topbar-actions">
        <button class="icon-btn" onclick="toggleTheme()" title="Mode clair/sombre" id="theme-btn">🌙</button>
        <div class="alert-bell" onclick="showPage('alertes')">
          🔔
          <span class="bell-badge" id="bell-badge">0</span>
        </div>
      </div>
    </header>

    <!-- PAGE CONTAINER -->
    <main class="page-container" id="page-container">
      <!-- pages injected here -->
    </main>
  </div>
</div>

<!-- MODAL ROOT -->
<div id="modal-root"></div>
<!-- TOAST ROOT -->
<div id="toast-root"></div>

<!-- Scripts -->
<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/medicaments.js"></script>
<script src="js/pages/categories.js"></script>
<script src="js/pages/fournisseurs.js"></script>
<script src="js/pages/vente.js"></script>
<script src="js/pages/achats.js"></script>
<script src="js/pages/clients.js"></script>
<script src="js/pages/credits.js"></script>
<script src="js/pages/factures.js"></script>
<script src="js/pages/alertes.js"></script>
<script src="js/pages/utilisateurs.js"></script>
<script src="js/pages/rapports.js"></script>
<script src="js/pages/corbeille.js"></script>
<script src="js/pages/parametres.js"></script>
</body>
</html>
